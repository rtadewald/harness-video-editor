[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ctc-forced-aligner>=1.0.2",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "langchain-core>=1.6,<2",
    "langchain-openrouter>=0.2.9,<0.3",
    "mlx-audio>=0.5.7",
    "mlx-whisper==0.4.3",
    "parakeet-mlx>=0.5.3",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "stable-ts>=2.19.1",
    "unidecode>=1.4.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
