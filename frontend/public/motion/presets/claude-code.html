<script>
  (function () {
    const W = MOTION.largura, H = MOTION.altura, D = MOTION.duracao
    const texto = String(MOTION.campos.prompt || '')
    const janela = document.getElementById('janela'), pan = document.getElementById('pan')
    const digitado = document.getElementById('digitado')
    const medida = document.getElementById('medida')

    // medido na referência (1080×1920): a janela entra com 922×782 (x 80, y 508) e cresce ×1,63 em ~1 s, com a origem perto da
    // borda esquerda, na altura do meio da tela; a curva quase não anda no começo e chega bem devagar
    const alto = H > W
    // na tela dividida (1080×960), a mesma composição: mesma largura e mesmo zoom (passa da borda direita), com a janela
    // mais baixa para caber na metade de cima
    const ALT = alto ? 782 : 500
    janela.style.height = `${ALT}px`
    const kIni = 1, kFim = 1.63
    const ini = { x: W * 0.074, y: alto ? H * 0.2646 : (H - ALT) / 2 }
    const fim = { x: W * 0.067, y: alto ? H * 0.1167 : H * 0.07 }

    const tl = gsap.timeline({ paused: true })
    gsap.set(janela, { x: ini.x, y: ini.y, scale: kIni })
    tl.to(janela, { x: fim.x, y: fim.y, scale: kFim, duration: Math.min(1.05, D * 0.5), ease: motion.curva(0.25, 0, 0.15, 1) }, 0)

    // a digitação começa em ~0,2 s, a ~14 letras por segundo (ou junto com a fala, se o texto for dito)
    const t0 = Math.min(0.2, D * 0.08)
    const tempos = motion.digitar(texto, t0, D - 0.2, 0.07)
    const t1 = tempos.length ? tempos[tempos.length - 1] : t0
    motion.som('entrada', 0)
    motion.som('digitacao', t0, t1 - t0 + 0.1)

    // a cena nunca para: depois do zoom ela desliza para a esquerda com velocidade crescente (na referência, o
    // deslocamento cresce como ~82·(t − 0,65)² px: aceleração de ~164 px/s²), até acompanhar a digitação; quando a
    // digitação acaba, a velocidade cai devagar para um deslize lento que segue até o corte
    const T0 = 0.65, ACEL = 164 * (W / 1080), LENTO = 40 * (W / 1080)
    const largLetra = () => { medida.textContent = 'MMMMMMMMMM'; return medida.offsetWidth / 10 } // a fonte pode chegar depois
    const velocidade = (t, vDig) => {
      if (t <= T0) return 0
      const subida = vDig * Math.tanh((ACEL * (Math.min(t, t1) - T0)) / Math.max(vDig, 1))
      return t <= t1 ? subida : LENTO + (subida - LENTO) * Math.exp(-(t - t1) / 0.7)
    }
    const deslize = (t, vDig) => {
      let soma = 0
      for (let s = 0; s < t; s += 1 / 240) soma += velocidade(s, vDig) / 240
      return soma
    }
    // proteção: o cursor nunca passa de ~90% da largura (só entra em textos longos demais para o deslize)
    const B = W * 0.9
    motion.aCada(function (t) {
      let n = 0
      while (n < tempos.length && tempos[n] <= t) n++
      digitado.textContent = texto.slice(0, n)
      const letra = largLetra(), k = gsap.getProperty(janela, 'scale')
      const vDig = (letra * kFim) / Math.max((t1 - t0) / Math.max(tempos.length, 1), 0.02) // a velocidade da digitação na tela
      const naTela = gsap.getProperty(janela, 'x') + (52 + digitado.offsetWidth) * k
      const d = Math.max(deslize(t, vDig), naTela - B)
      pan.style.transform = `translateX(${-d}px)`
    })
    tl.to({}, { duration: 0 }, D)
    motion.pronto(tl)
  })()
</script>
