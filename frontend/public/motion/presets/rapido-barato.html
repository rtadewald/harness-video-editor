<script type="application/json" id="preset">{"nome": "Rápido e barato", "descricao": "Prova em dois cards de vidro lado a lado, quase sem texto: um medidor semicircular cujo ponteiro sobe para a zona rápida enquanto a latência cai, e uma barra de custo que encolhe enquanto o valor desce e ganha um chip verde ✓ (com leve atraso); a cena se aproxima devagar até o corte.", "fundo": "chuva", "duracao": 2.5, "a_revisar": true, "sons": {"confirmacao": {"rotulo": "O chip ✓ aparece", "som": "ui-pop-02", "intensidade": "baixo"}}}</script>
<script type="application/json" id="campos">{"antes_tempo": {"tipo": "texto", "rotulo": "Latência antes", "padrao": "4,2 s"}, "depois_tempo": {"tipo": "texto", "rotulo": "Latência depois", "padrao": "1,1 s"}, "antes_custo": {"tipo": "texto", "rotulo": "Custo antes", "padrao": "$ 1,20"}, "depois_custo": {"tipo": "texto", "rotulo": "Custo depois", "padrao": "$ 0,30"}, "rotulo_tempo": {"tipo": "texto", "rotulo": "Rótulo do medidor", "padrao": "latência"}, "rotulo_custo": {"tipo": "texto", "rotulo": "Rótulo do custo", "padrao": "custo"}}</script>
<style>
  /* o vidro do design system da Asimov (.glass-card): fundo branco 5%, borda de 1 px branca 10%, desfoque de 12 px da
   * chuva atrás, cantos de 1rem (--radius-2xl). Inter 400: números com o tracking-tight (-.025em) em #ffffffe0, rótulos
   * em #ffffffb8 (o texto secundário); trilhos e marcas em branco translúcido, coral do Claude como acento, verde dos
   * checks. Medidas em px do palco (1080 de largura). */
  #cena { position: absolute; inset: 0; will-change: transform; font-family: Inter, "SF Pro", system-ui, sans-serif; }
  #grupo { position: absolute; left: 50%; top: 50%; width: 976px; height: 560px; margin: -280px 0 0 -488px; }
  .card { position: absolute; top: 0; width: 470px; height: 560px; box-sizing: border-box; border-radius: 16px; background-color: #ffffff0d; border: 1px solid #ffffff1a;
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); opacity: 0; will-change: transform, opacity; overflow: hidden; }
  #c1 { left: 0; } #c2 { left: 506px; }
  .topo { position: absolute; left: 0; right: 0; top: 0; height: 94px; border-bottom: 1px solid #ffffff1a; }
  .rotulo { position: absolute; left: 36px; top: 0; right: 120px; line-height: 94px; font-size: 30px; font-weight: 400; letter-spacing: -.01em;
    color: #ffffffb8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ponto { position: absolute; right: 36px; top: 40px; width: 14px; height: 14px; border-radius: 50%; background: #d97757; }
  .valor { position: absolute; left: 20px; right: 20px; top: 432px; height: 90px; line-height: 90px; text-align: center; white-space: nowrap;
    font-size: 74px; font-weight: 400; letter-spacing: -.025em; color: #ffffffe0; font-variant-numeric: tabular-nums; }
  #medidor { position: absolute; left: 0; top: 0; width: 470px; height: 430px; overflow: visible; }
  /* a barra de custo: o contorno tracejado guarda a altura antiga; o preenchimento coral encolhe */
  #fantasma { position: absolute; left: 169px; width: 132px; top: 148px; height: 250px; border-radius: 14px; border: 1px dashed #ffffff3d; background: #ffffff0a; box-sizing: border-box; }
  #barra { position: absolute; left: 169px; width: 132px; bottom: 162px; height: 250px; border-radius: 14px; background: linear-gradient(180deg, #e08a6c 0%, #d97757 100%);
    box-shadow: 0 10px 30px rgba(217, 119, 87, .22); will-change: height; }
  #base2 { position: absolute; left: 110px; width: 250px; top: 398px; height: 2px; border-radius: 2px; background: #ffffff24; }
  /* o chip: um botão de vidro (o secundário do design system) tingido de verde */
  #chip { position: absolute; right: 26px; top: 22px; height: 50px; padding: 0 10px; box-sizing: border-box; border-radius: 25px; background: rgba(77, 182, 103, .12);
    border: 1px solid rgba(77, 182, 103, .35); display: flex; align-items: center; gap: 8px; opacity: 0; will-change: transform, opacity; }
  #chip i { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: #4db667; }
  #chip i svg { width: 20px; height: 20px; }
</style>
<div id="cena"><div id="grupo">
  <div class="card" id="c1">
    <div class="topo"><div class="rotulo" id="r1"></div><div class="ponto"></div></div>
    <svg id="medidor" viewBox="0 0 470 430">
      <g id="marcas"></g>
      <path id="trilho" fill="none" stroke="#ffffff1a" stroke-width="22" stroke-linecap="round" />
      <path id="zona" fill="none" stroke="rgba(217, 119, 87, .22)" stroke-width="22" stroke-linecap="round" />
      <path id="cheio" fill="none" stroke="#d97757" stroke-width="22" stroke-linecap="round" />
      <line id="ponteiro" stroke="#ffffffe0" stroke-width="6" stroke-linecap="round" />
      <circle id="eixo" r="14" fill="#ffffffe0" />
    </svg>
    <div class="valor" id="v1"></div>
  </div>
  <div class="card" id="c2">
    <div class="topo"><div class="rotulo" id="r2"></div>
      <div id="chip"><i><svg viewBox="0 0 20 20" fill="none" stroke="#122b18" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10.4l3.2 3.1L15 6.6" /></svg></i></div>
    </div>
    <div id="fantasma"></div><div id="barra"></div><div id="base2"></div>
    <div class="valor" id="v2"></div>
  </div>
</div></div>
<script>
  (function () {
    const W = MOTION.largura, H = MOTION.altura, D = MOTION.duracao
    const c = MOTION.campos
    const txt = (k, p) => String(c[k] == null || c[k] === '' ? p : c[k])
    const t0 = txt('antes_tempo', '4,2 s'), t1 = txt('depois_tempo', '1,1 s')
    const k0 = txt('antes_custo', '$ 1,20'), k1 = txt('depois_custo', '$ 0,30')
    document.getElementById('r1').textContent = txt('rotulo_tempo', 'latência')
    document.getElementById('r2').textContent = txt('rotulo_custo', 'custo')
    const cena = document.getElementById('cena'), grupo = document.getElementById('grupo')
    const cards = [document.getElementById('c1'), document.getElementById('c2')]
    const v1 = document.getElementById('v1'), v2 = document.getElementById('v2')
    const chip = document.getElementById('chip'), barra = document.getElementById('barra')

    // um texto com número ("4,2 s", "$ 1,20", "R$ 1.200,00/mês"): o que vem antes, o número, o que vem depois, as casas
    // decimais e os separadores (o último separador é o decimal, salvo se vier seguido de 3 dígitos: aí é de milhar).
    // A contagem vai de um ao outro no formato do "depois" (sem número: troca no meio)
    const ler = (s) => {
      const m = s.match(/\d[\d.,]*\d|\d/)
      if (!m) return null
      const n = m[0], u = Math.max(n.lastIndexOf('.'), n.lastIndexOf(','))
      const decimal = u >= 0 && (n.length - u - 1 !== 3 || (n.includes('.') && n.includes(',')))
      const sep = decimal ? n[u] : ',', mil = decimal ? (n[u] === ',' ? '.' : ',') : u >= 0 ? n[u] : ''
      const inteiro = (decimal ? n.slice(0, u) : n).replace(/[.,]/g, ''), frac = decimal ? n.slice(u + 1) : ''
      return { pre: s.slice(0, m.index), pos: s.slice(m.index + n.length), v: parseFloat(inteiro + '.' + (frac || '0')), dec: frac.length, sep, mil: /[.,]/.test(decimal ? n.slice(0, u) : n) ? mil : '' }
    }
    const escrever = (v, dec, sep, mil) => {
      const [i, f] = v.toFixed(dec).split('.')
      return (mil ? i.replace(/\B(?=(\d{3})+(?!\d))/g, mil) : i) + (f ? sep + f : '')
    }
    const contador = (a, b) => {
      const A = ler(a), B = ler(b)
      if (!A || !B) return (q) => (q < 0.5 ? a : b)
      const dec = Math.max(A.dec, B.dec), mil = B.mil || A.mil, sep = B.dec ? B.sep : A.dec ? A.sep : mil === '.' ? ',' : '.'
      return (q) => {
        if (q <= 0) return a
        if (q >= 1) return b
        return B.pre + escrever(A.v + (B.v - A.v) * q, dec, sep, mil) + B.pos
      }
    }
    const conta1 = contador(t0, t1), conta2 = contador(k0, k1)
    // a barra de custo encolhe na proporção dos valores (entre 8% e 100% da altura antiga)
    const K0 = ler(k0), K1 = ler(k1)
    const prop = K0 && K1 && K0.v > 0 ? Math.max(0.08, Math.min(1, K1.v / K0.v)) : 0.25
    const ALTO = 250

    // o medidor: semicírculo de raio 180 com o eixo em (235, 396); a zona rápida é o último quarto (à direita)
    const CX = 235, CY = 396, R = 180, A0 = 0.14, A1 = 0.86
    const pt = (f, r) => { const a = Math.PI + Math.PI * f; return [CX + Math.cos(a) * r, CY + Math.sin(a) * r] }
    const arco = (f0, f1) => { const [x0, y0] = pt(f0, R), [x1, y1] = pt(f1, R); return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${R} ${R} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}` }
    document.getElementById('trilho').setAttribute('d', arco(0, 1))
    document.getElementById('zona').setAttribute('d', arco(0.74, 1))
    const marcas = document.getElementById('marcas')
    for (let i = 0; i <= 10; i++) {
      const [x0, y0] = pt(i / 10, R + 26), [x1, y1] = pt(i / 10, R + (i % 5 ? 36 : 44))
      marcas.insertAdjacentHTML('beforeend', `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="${i / 10 >= 0.74 ? 'rgba(217, 119, 87, .55)' : '#ffffff38'}" stroke-width="2.5" stroke-linecap="round"/>`)
    }
    const cheio = document.getElementById('cheio'), ponteiro = document.getElementById('ponteiro'), eixo = document.getElementById('eixo')
    eixo.setAttribute('cx', CX); eixo.setAttribute('cy', CY)
    ponteiro.setAttribute('x1', CX); ponteiro.setAttribute('y1', CY)

    // o estado que a timeline anima; o desenho sai dele a cada instante (motion.aCada)
    const st = { g: 0, n1: 0, n2: 0, b: 0 }
    const desenhar = () => {
      const f = A0 + (A1 - A0) * st.g
      cheio.setAttribute('d', arco(0, f))
      const [px, py] = pt(f, R - 38)
      ponteiro.setAttribute('x2', px.toFixed(2)); ponteiro.setAttribute('y2', py.toFixed(2))
      v1.textContent = conta1(st.n1)
      v2.textContent = conta2(st.n2)
      barra.style.height = `${(ALTO * (1 - (1 - prop) * st.b)).toFixed(2)}px`
    }

    // o par um pouco menor que o palco, para sobrar margem mesmo no fim da aproximação; na tela cheia, acima do meio
    gsap.set(grupo, { scale: 0.94, y: H > W ? -H * 0.06 : 0 })

    document.fonts.ready.then(() => {
      // os valores longos: a fonte diminui (igual nos dois cards) até o maior caber no card
      const textos = [t0, t1, k0, k1]
      let tam = 74
      const sobra = () => [v1, v2].some((el, i) => textos.slice(i * 2, i * 2 + 2).some((s) => { el.textContent = s; return el.scrollWidth > el.clientWidth + 1 }))
      while (sobra() && tam > 40) { tam -= 4; [v1, v2].forEach((el) => { el.style.fontSize = `${tam}px` }) }
      montar()
    })

    function montar() {
      const k = Math.min(1, D / 2.5) // planos curtos: a sequência encolhe junto (de 1,5 a 4 s)
      const CASA = motion.curva(0.25, 0.1, 0.1, 1) // entrada curta e suave, chegada bem longa
      const chega = (dur) => { let x = 0; while (x < 1 && CASA(x) < 0.95) x += 0.005; return x * dur }
      const tl = gsap.timeline({ paused: true })

      // os cards entram juntos (o 2º um pouco depois), subindo e saindo do desfoque
      cards.forEach((card, i) => tl.fromTo(card, { opacity: 0, y: 34, scale: 0.97, filter: 'blur(6px)' },
        { opacity: 1, y: 0, scale: 1, filter: 'blur(0px)', duration: 0.55 * k, ease: CASA }, i * 0.1 * k))

      // velocidade: o ponteiro sobe para a zona rápida enquanto a latência cai
      const iG = 0.12 * k, dG = 1.15 * k
      tl.fromTo(st, { g: 0 }, { g: 1, duration: dG, ease: CASA }, iG)
      tl.fromTo(st, { n1: 0 }, { n1: 1, duration: dG, ease: CASA }, iG)
      // custo, com leve atraso: a barra encolhe enquanto o valor desce; no fim, o chip ✓
      const iC = iG + 0.2 * k, dC = 1.0 * k
      tl.fromTo(st, { b: 0 }, { b: 1, duration: dC, ease: CASA }, iC)
      tl.fromTo(st, { n2: 0 }, { n2: 1, duration: dC, ease: CASA }, iC)
      const tChip = iC + chega(dC) - 0.05 * k
      tl.fromTo(chip, { opacity: 0, scale: 0.7, x: 10 }, { opacity: 1, scale: 1, x: 0, duration: 0.5 * k, ease: CASA }, tChip)
      motion.som('confirmacao', tChip)

      // a cena nunca para: se aproxima devagar o plano inteiro e termina ainda andando
      gsap.set(cena, { transformOrigin: `${W / 2}px ${H / 2}px` })
      tl.fromTo(cena, { scale: 1 }, { scale: 1.05, duration: D, ease: motion.curva(0.2, 0.05, 0.1, 0.45) }, 0)
      tl.to({}, { duration: 0 }, D)
      motion.aCada(desenhar)
      motion.pronto(tl)
    }
  })()
</script>
