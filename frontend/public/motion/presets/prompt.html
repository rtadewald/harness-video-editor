<script>
  (function () {
    const W = MOTION.largura, H = MOTION.altura, D = MOTION.duracao
    const texto = String(MOTION.campos.prompt || '')
    const card = document.getElementById('card'), digitado = document.getElementById('digitado')

    // a base do card fica parada (as linhas novas crescem para cima, de uma vez, como na referência)
    const alto = H > W
    const base = alto ? 1 : 0.8
    card.style.bottom = `${H - (alto ? H * 0.6 : H * 0.8)}px`

    // o afastamento (medido, 24 fps): começa a 1,25× (o card passa das bordas), arranca devagar, acelera até ~0,5 s e
    // segue numa velocidade lenta e constante até o corte — nunca para (a curva termina ainda andando)
    const tl = gsap.timeline({ paused: true })
    tl.fromTo(card, { scale: base * 1.25 }, { scale: base, duration: D, ease: motion.curva(0.2, 0.05, 0.1, 0.45) }, 0)

    // a digitação vem em rajadas, rápida (~0,018 s por letra, com pausas na pontuação e entre algumas palavras); começou
    // antes do corte: no 1º quadro já há algumas letras
    const tempos = motion.digitar(texto, -0.25, D - 0.1, 0.0185)
    motion.aCada(function (t) {
      let n = 0
      while (n < tempos.length && tempos[n] <= t) n++
      digitado.textContent = texto.slice(0, n)
    })
    motion.pronto(tl)
  })()
</script>
